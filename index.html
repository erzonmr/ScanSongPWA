<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cantoral</title>
  <meta name="description" content="Escanea tu cancionero, quita los acordes y guarda las letras en la nube." />
  <meta name="theme-color" content="#1f2a44" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cantoral" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Volver" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="topbar-title" id="topbar-title">Cantoral</h1>
    <span class="sync-dot" id="sync-dot" title="Estado de sincronización" hidden></span>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="offline-banner" id="offline-banner" hidden>Sin conexión — tus canciones viven en la nube; reconéctate para ver y guardar cambios.</div>

  <main id="app" class="app" aria-live="polite">
    <div class="center-msg"><div class="spinner"></div></div>
  </main>

  <!-- Inputs de captura (ocultos). capture="environment" abre la cámara trasera en móviles. -->
  <input type="file" id="input-camera" accept="image/*" capture="environment" hidden />
  <input type="file" id="input-gallery" accept="image/*" hidden />

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
